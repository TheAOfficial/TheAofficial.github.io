<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0408"/><stop offset=".6" stop-color="#220815"/><stop offset="1" stop-color="#3a0d24"/></linearGradient>
<linearGradient id="pk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2daa"/><stop offset="1" stop-color="#8b1a3a"/></linearGradient>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2daa"/><stop offset="1" stop-color="#c6ff72"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#ff2daa" stop-opacity=".6"/><stop offset="1" stop-color="#ff2daa" stop-opacity="0"/></radialGradient>
<radialGradient id="gg"><stop offset="0" stop-color="#c6ff72" stop-opacity=".5"/><stop offset="1" stop-color="#c6ff72" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ff2daa" stroke-opacity=".10"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/></pattern>
</defs><style>
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes dash{to{stroke-dashoffset:-80}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.up{opacity:0;animation:up .9s ease forwards}
.blink{animation:blink 1.4s ease-in-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite}
</style>
<rect width="900" height="170" rx="22" fill="url(#bg)"/>
<clipPath id="fc"><rect width="900" height="170" rx="22"/></clipPath><g clip-path="url(#fc)"><g opacity="0.55"><path d="M0 70 Q75 30 150 70 T300 70 T450 70 T600 70 T750 70 T900 70 T1050 70 T1200 70 T1350 70 T1500 70 T1650 70 T1800 70 V170 H0Z" fill="#8b1a3a"><animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="9s" repeatCount="indefinite"/></path></g><g opacity="0.35"><path d="M0 70 Q75 30 150 70 T300 70 T450 70 T600 70 T750 70 T900 70 T1050 70 T1200 70 T1350 70 T1500 70 T1650 70 T1800 70 V140 H0Z" fill="#ff2daa"><animateTransform attributeName="transform" type="translate" from="-150 0" to="-450 0" dur="14s" repeatCount="indefinite"/></path></g><g opacity="0.9"><path d="M0 70 Q75 30 150 70 T300 70 T450 70 T600 70 T750 70 T900 70 T1050 70 T1200 70 T1350 70 T1500 70 T1650 70 T1800 70 V140 H0Z" fill="#3a0d24"><animateTransform attributeName="transform" type="translate" from="-60 0" to="-360 0" dur="11s" repeatCount="indefinite"/></path></g></g>
<text x="450" y="70" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="34" font-style="italic" fill="#fff0f5" class="bob">Let’s build the future together.</text>
