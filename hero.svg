<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14070d"/><stop offset="1" stop-color="#3b0f24"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e11d62"/><stop offset="1" stop-color="#8b1a3a"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#e11d62" stop-opacity=".55"/><stop offset="1" stop-color="#e11d62" stop-opacity="0"/></radialGradient></defs>
<style>
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes dash{to{stroke-dashoffset:-60}}
.t{opacity:0;animation:up .9s ease forwards}
.d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
.glow{transform-origin:760px 150px;animation:pulse 4s ease-in-out infinite}
.ring{stroke-dasharray:14 10;animation:dash 3s linear infinite}
</style>
<rect width="900" height="300" rx="22" fill="url(#g)"/>
<circle class="glow" cx="760" cy="150" r="170" fill="url(#glow)"/>
<circle class="ring" cx="760" cy="150" r="95" fill="none" stroke="#e11d62" stroke-width="2"/>
<circle cx="760" cy="150" r="70" fill="#2a0b1a" stroke="#8b1a3a" stroke-width="2"/>
<text x="760" y="168" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="56" font-style="italic" fill="#ffd1e0">V</text>
<text class="t d1" x="50" y="70" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="4" fill="#e11d62">AI DEVELOPER  ·  ENTREPRENEUR</text>
<text class="t d2" x="50" y="150" font-family="Georgia,'Times New Roman',serif" font-size="72" fill="#fff0f5">Vikas Kumar<tspan fill="#e11d62">.</tspan></text>
<text class="t d3" x="50" y="192" font-family="Georgia,'Times New Roman',serif" font-size="22" font-style="italic" fill="#f3b4c8">Engineering intelligence. Building VaeonAI.</text>
<text class="t d4" x="50" y="250" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#b86a85">Think Beyond Limits.  Build the Future.  Stay Unstoppable.</text>
<rect x="1" y="1" width="898" height="298" rx="22" fill="none" stroke="url(#a)" stroke-width="2" opacity=".7"/>
</svg>